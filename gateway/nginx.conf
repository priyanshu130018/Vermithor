events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Limit Request Body Size
    client_max_body_size 10m;

    # Upstream Proxy Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_summary:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_logs:10m rate=10r/s;
    limit_req_status 429;

    # Upstream Modular Monolith Backend
    upstream backend_service {
        server vermithor-backend:8000;
        keepalive 16;
    }

    # Map for conditional HSTS (only on HTTPS)
    map $https $hsts_header {
        on "max-age=31536000; includeSubDomains";
        default "";
    }

    server {
        listen 80;
        server_name localhost vermithor.local;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://vermithor.local;" always;

        # Request ID Tracing
        set $req_id $request_id;
        if ($http_x_request_id != "") {
            set $req_id $http_x_request_id;
        }
        add_header X-Request-ID $req_id always;

        # Method Filter: Reject unexpected HTTP verbs
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
            return 405;
        }

        # Gateway Health Check (Public, no JWT required)
        location = /health {
            default_type application/json;
            return 200 '{"service":"vermithor-gateway","status":"healthy"}\n';
        }

        # 429 Rate Limit Error Response Handler
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 5 always;
            return 429 '{"error":"too_many_requests","message":"Rate limit exceeded. Please retry later.","request_id":"$req_id"}\n';
        }

        # 405 Method Not Allowed Response Handler
        error_page 405 = @method_not_allowed;
        location @method_not_allowed {
            default_type application/json;
            return 405 '{"error":"method_not_allowed","message":"HTTP method not supported.","request_id":"$req_id"}\n';
        }

        # Summary Generation Endpoints (Rate limit: 2r/s)
        location ~ ^/api/v1/summaries {
            limit_req zone=api_summary burst=5 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Log Intelligence Search & Ingestion Endpoint (Rate limit: 10r/s)
        location ~ ^/api/v1/logs {
            limit_req zone=api_logs burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Incident Service Routes & Incident Summary Aliases
        location ~ ^/api/v1/incidents {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Metric Observations Routes
        location ~ ^/api/v1/observations {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Anomaly Detection Service Routes
        location ~ ^/api/v1/anomal(ies|y) {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Correlation Engine Service Routes
        location ~ ^/api/v1/correlation {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # RCA Service Routes
        location ~ ^/api/v1/rca {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Retrieval / RAG Service Routes
        location ~ ^/api/v1/retrieval {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Runbooks CRUD Routes
        location ~ ^/api/v1/runbooks {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }

        # Events / Ingestion Service Routes
        location ~ ^/api/v1/events {
            limit_req zone=api_general burst=20 nodelay;
            access_by_lua_file /usr/local/openresty/nginx/conf/jwt_auth.lua;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
        }
    }
}
