services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: vermithor-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vermithor-network

  redis:
    image: redis:7-alpine
    container_name: vermithor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vermithor-network

  jaeger:
    image: jaegertracing/all-in-one:1.55.0
    container_name: vermithor-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - vermithor-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: vermithor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - gateway
      - backend
    networks:
      - vermithor-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vermithor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - vermithor-network

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vermithor-migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: INFO
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      DATABASE_URL: ${DATABASE_URL_UNPOOLED:-${DATABASE_URL}}
    networks:
      - vermithor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vermithor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: INFO
      SERVICE_NAME: vermithor-backend
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vermithor-dev-secret-key-32-chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-vermithor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vermithor-api}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-true}
      STATISTICAL_WARNING_Z: 3.0
      STATISTICAL_CRITICAL_Z: 4.0
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      HF_EMBEDDING_BASE_URL: ${HF_EMBEDDING_BASE_URL:-https://router.huggingface.co/hf-inference}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_INVESTIGATION_MODEL: ${HF_INVESTIGATION_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_SUMMARY_MODEL: ${HF_SUMMARY_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_REVIEW_MODEL: ${HF_REVIEW_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: vermithor-backend
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      JAEGER_QUERY_URL: ${JAEGER_QUERY_URL:-http://jaeger:16686}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - vermithor-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vermithor-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: INFO
      SERVICE_NAME: vermithor-worker
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vermithor-dev-secret-key-32-chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-vermithor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vermithor-api}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-true}
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      HF_EMBEDDING_BASE_URL: ${HF_EMBEDDING_BASE_URL:-https://router.huggingface.co/hf-inference}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_INVESTIGATION_MODEL: ${HF_INVESTIGATION_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_SUMMARY_MODEL: ${HF_SUMMARY_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_REVIEW_MODEL: ${HF_REVIEW_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: vermithor-worker
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      JAEGER_QUERY_URL: ${JAEGER_QUERY_URL:-http://jaeger:16686}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - vermithor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: vermithor-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - gateway
    networks:
      - vermithor-network

networks:
  vermithor-network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
