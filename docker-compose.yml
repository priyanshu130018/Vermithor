services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: vermithor-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-vermithor-dev-secret-key-32-chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-vermithor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vermithor-api}
    depends_on:
      - backend
    networks:
      - vermithor-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vermithor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vermithor}
      POSTGRES_USER: ${POSTGRES_USER:-vermithor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vermithor_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vermithor} -d ${POSTGRES_DB:-vermithor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vermithor-network

  redis:
    image: redis:7-alpine
    container_name: vermithor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vermithor-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vermithor-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - vermithor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: vermithor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - gateway
      - backend
    networks:
      - vermithor-network

  grafana:
    image: grafana/grafana:latest
    container_name: vermithor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - vermithor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vermithor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      SERVICE_NAME: vermithor-backend
      PORT: 8000
      HOST: 0.0.0.0
      POSTGRES_USER: ${POSTGRES_USER:-vermithor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vermithor_password}
      POSTGRES_DB: ${POSTGRES_DB:-vermithor}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vermithor}:${POSTGRES_PASSWORD:-vermithor_password}@postgres:5432/${POSTGRES_DB:-vermithor}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vermithor-dev-secret-key-32-chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-vermithor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vermithor-api}
      STATISTICAL_WARNING_Z: 3.0
      STATISTICAL_CRITICAL_Z: 4.0
      ISOLATION_FOREST_CONTAMINATION: auto
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      EMBEDDING_DEVICE: cpu
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.2:3b
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vermithor-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vermithor-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      SERVICE_NAME: vermithor-worker
      POSTGRES_USER: ${POSTGRES_USER:-vermithor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vermithor_password}
      POSTGRES_DB: ${POSTGRES_DB:-vermithor}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vermithor}:${POSTGRES_PASSWORD:-vermithor_password}@postgres:5432/${POSTGRES_DB:-vermithor}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vermithor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vermithor-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - gateway
    networks:
      - vermithor-network

networks:
  vermithor-network:
    driver: bridge

volumes:
  postgres_data:
