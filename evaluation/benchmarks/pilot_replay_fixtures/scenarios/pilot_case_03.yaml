id: PILOT-CASE-03
scenario_name: catalog_cache_redis_maxmemory_eviction_storm
target_service: catalog-cache
environment: production
severity: HIGH
agent_input:
  incident_key: INC-PILOT-203
  service: catalog-cache
  lookback_minutes: 30
  metrics:
  - metric_name: redis_memory_used_ratio
    service: catalog-cache
    value: 1.0
    timestamp: '2026-10-20T11:10:00Z'
  - metric_name: redis_evicted_keys_rate
    service: catalog-cache
    value: 1520.0
    timestamp: '2026-10-20T11:10:00Z'
  - metric_name: cache_miss_ratio
    service: catalog-cache
    value: 0.78
    timestamp: '2026-10-20T11:15:00Z'
  logs:
  - service: catalog-cache
    level: WARN
    message: 'RedisClient: High key eviction rate observed under maxmemory constraint'
    timestamp: '2026-10-20T11:11:00Z'
  - service: catalog-cache
    level: ERROR
    message: 'RedisOOMException: OOM command not allowed when used memory > ''maxmemory''
      (6442450944 bytes)'
    timestamp: '2026-10-20T11:12:00Z'
  deployments: []
  dependencies:
  - redis-cluster
