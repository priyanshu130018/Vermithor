environment: production
severity: HIGH
agent_input:
  incident_key: INC-PILOT-205
  service: doc-renderer
  lookback_minutes: 30
  metrics:
  - metric_name: disk_inode_usage_ratio
    service: doc-renderer
    value: 1.0
    timestamp: '2026-10-20T11:10:00Z'
  - metric_name: disk_space_available_bytes
    service: doc-renderer
    value: 52428800.0
    timestamp: '2026-10-20T11:10:00Z'
  - metric_name: document_render_failure_rate
    service: doc-renderer
    value: 0.65
    timestamp: '2026-10-20T11:15:00Z'
  logs:
  - service: doc-renderer
    level: WARN
    message: 'DiskMonitor: Filesystem /tmp inode utilization reached 99.8%'
    timestamp: '2026-10-20T11:11:00Z'
  - service: doc-renderer
    level: ERROR
    message: 'IOException: No space left on device while creating temporary render
      buffer'
    timestamp: '2026-10-20T11:12:00Z'
  deployments: []
  dependencies:
  - ephemeral-storage
