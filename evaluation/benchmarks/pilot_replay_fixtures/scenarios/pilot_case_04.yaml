    level: WARN
    message: 'CoreDNS: Resolving partner-pay.external.net via upstream UDP 10.96.0.10:53
      timed out'
    timestamp: '2026-10-20T11:11:00Z'
  - service: checkout-api
    level: ERROR
    message: 'ConnectTimeoutException: Timeout resolving partner-pay.external.net
      (CoreDNS drop)'
    timestamp: '2026-10-20T11:12:00Z'
  deployments: []
  dependencies:
  - partner-pay
  - coredns
