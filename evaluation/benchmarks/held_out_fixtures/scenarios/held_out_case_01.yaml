id: HELDOUT-CASE-01
scenario_name: billing_worker_coredns_udp_timeout
target_service: billing-worker
environment: production
severity: CRITICAL
agent_input:
  incident_key: INC-HELDOUT-301
  service: billing-worker
  lookback_minutes: 30
  metrics:
  - metric_name: dns_resolution_latency_ms
    service: billing-worker
    value: 3400.0
    timestamp: '2026-10-20T14:10:00Z'
  - metric_name: http_client_request_timeout_ratio
    service: billing-worker
    value: 0.45
    timestamp: '2026-10-20T14:10:00Z'
