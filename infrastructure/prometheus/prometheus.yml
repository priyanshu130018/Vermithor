global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "vermithor-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:80"]

  - job_name: "vermithor-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["vermithor-backend:8000"]
